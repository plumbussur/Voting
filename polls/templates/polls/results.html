{% extends "polls/base.html" %}

{% block title %}<title>Итоги</title>{% endblock title %}



{% block content %}
<div class="poll-container">

   
        
            <h1 class="poll-question">{{ question.question_text }}</h1>
       

            <ul class="poll-option">
            {% for choice in question.choice_set.all %}
            <label >{{ choice.choice_text }} - Кол-во ответов - {{ choice.votes }}</label><br>
            {% endfor %}
            </ul>
            <div class="button-group">

                <a  class="submit-btn-result" href="{% url 'polls:detail' question.id %}">Проголосовать еще раз</a>
                <a  class="submit-btn-result" href="{% url 'polls:index'%}">Главное меню</a>
            </div>
        
            
           
       
     
    

</div>  
{% endblock content %}
